plugins {
    // Minecraft 26.x nie ma zaszyfrowanych nazw, więc Loom bez przemapowywania (kod używa nazw Mojanga).
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Wersja moda dla Minecrafta 26.1.2 (każda wersja gry ma własny folder w versions/).
def mc = '26.1.2'
def target = [fabric: '0.155.3+26.1.2', modmenu: '18.0.2']

// Nazwa jara i wersja w grze: aio-pvp-<wersja moda>+<wersja Minecrafta>, np. aio-pvp-1.0.31+26.1.2.jar.
version = "${project.mod_version}+${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.fabric}"

    // Mod Menu: opcjonalny. Bez niego mod działa, tylko nie ma przycisku konfiguracji na liście modów.
    compileOnly "maven.modrinth:modmenu:${target.modmenu}"
    localRuntime "maven.modrinth:modmenu:${target.modmenu}"
}

processResources {
    def props = [version: project.version, minecraft: mc]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

// Testy klienta (Fabric client gametest): uruchamiają grę, tworzą świat i robią zrzuty ekranu modułów.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "aio_pvp_test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Tymczasowo przy przenoszeniu: ./gradlew runClientGameTest -Paudit wypisuje wszystkie nietrafione cele mixinów naraz.
if (project.hasProperty("audit")) {
    loom.runs.configureEach {
        vmArg "-Dmixin.debug.countInjections=true"
    }
}
