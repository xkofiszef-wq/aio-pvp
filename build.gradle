buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.6.1'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    id 'maven-publish'

}

// Nazwa jara i wersja w grze: aio-pvp-<wersja moda>+<wersja Minecrafta>, np. aio-pvp-1.0.23+1.21.11.jar.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}



dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu: opcjonalny. Bez niego mod działa, tylko nie ma przycisku konfiguracji na liście modów.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    // spark (profiler): tylko w dev (runClient / testy), nie trafia do jara moda. W grze: /sparkc profiler.
    modLocalRuntime "maven.modrinth:spark:${project.spark_version}"
    modLocalRuntime "maven.modrinth:fabric-permissions-api:0.6.1"



}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

// Obfuskacja (zaciemnienie) gotowego .jar: MUSI biec po remapJar, bo mixiny są wtedy już przemapowane.
// Zmienia nazwy klas/pól/metod w pakietach logiki (config, gui, hud, media, module, render); mixiny i
// entrypointy zostają z oryginalnymi nazwami, bo ładuje je Fabric/Mixin po nazwie z JSON-a.
tasks.register('proguardJar', proguard.gradle.ProGuardTask) {
    dependsOn tasks.named('remapJar')
    def inputJar = tasks.named('remapJar').flatMap { it.archiveFile }
    def outputJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}-obf.jar")

    injars inputJar
    outjars outputJar

    // Biblioteki (nie są obfuskowane, tylko potrzebne do analizy): Minecraft, Fabric, ModMenu + JDK.
    libraryjars configurations.runtimeClasspath
    doFirst {
        new File(System.getProperty('java.home'), 'jmods').listFiles()?.each {
            libraryjars([filter: '!module-info.class'], it.path)
        }
    }

    // Tylko zmiana nazw: bez usuwania i optymalizacji (to psuje kod wołany przez Mixin/Fabric przez refleksję).
    dontshrink()
    dontoptimize()
    dontwarn()
    keepattributes '*Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions'
    // Zasoby (assets/aio_pvp/**) zostają nietknięte: nie włączamy adaptresourcefilenames/contents.

    // Zostają z oryginalnymi nazwami:
    keep 'public class pl.kerf.project.AioPvp { *; }'
    keep 'public class pl.kerf.project.ModMenuIntegration { *; }'
    keep 'class pl.kerf.project.mixin.** { *; }'
}

// Testy klienta (Fabric client gametest): uruchamiają grę, tworzą świat i robią zrzuty ekranu modułów.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "aio_pvp_test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Test zgodności z modami wydajnościowymi (Sodium, ImmediatelyFast z run/perf-mods, pobrane z Modrinth):
// ./gradlew runClientGameTest -Pperf. Fabric sam przemapowuje te jary w grze testowej; bez -Pperf ich nie ma.
if (project.hasProperty("perf")) {
    loom.runs.configureEach {
        vmArg "-Dfabric.addMods=${file('run/perf-mods').absolutePath}"
    }
}
