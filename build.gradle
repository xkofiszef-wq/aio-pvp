import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// Wspólny skrypt dla każdej wersji Minecrafta (Stonecutter uruchamia go w versions/<wersja>/).
// 1.21.11 ma zaszyfrowane nazwy, więc Loom przemapowuje je na nazwy Mojanga; 26.x ich nie ma i nie potrzebuje.
def obfuscated = stonecutter.current.parsed.matches('<26')
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

def mc = project.minecraft_version
def javaVersion = project.java_version as int

// Nazwa jara i wersja w grze: aio-pvp-<wersja moda>+<wersja Minecrafta>, np. aio-pvp-1.0.52+1.21.11.jar.
version = "${project.mod_version}+${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Nazwy zmienione w 26.x, które występują w kodzie tak często, że zamiast //? if są podmieniane w całym src/.
stonecutter {
    replacements.regex(stonecutter.current.parsed.matches('>=26')) {
        replace(/\bGuiGraphics\b/, 'GuiGraphicsExtractor')
        reverse(/\bGuiGraphicsExtractor\b/, 'GuiGraphics')
    }
    replacements.regex(stonecutter.current.parsed.matches('>=26')) {
        replace(/\bcontext\.drawString\(/, 'context.text(')
        reverse(/\bcontext\.text\(/, 'context.drawString(')
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        // Mod Menu: opcjonalny. Bez niego mod działa, tylko nie ma przycisku konfiguracji na liście modów.
        modCompileOnly project.modmenu
        modLocalRuntime project.modmenu
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        compileOnly project.modmenu
        localRuntime project.modmenu
    }
}

processResources {
    def props = [version: project.version, minecraft: project.minecraft_dependency, java: javaVersion]
    inputs.properties props

    filesMatching(['fabric.mod.json', 'aio_pvp.mixins.json']) {
        expand props
    }

    // W aio_pvp.mixins.json są mixiny wszystkich wersji. Zostają tylko te, które w tej wersji mają kod
    // (plik mixinu z innej wersji jest w całości w komentarzu //? if, więc nie powstaje z niego klasa).
    def classes = tasks.named('compileJava').flatMap { it.destinationDirectory }
    dependsOn 'compileJava'
    doLast {
        def file = new File(destinationDir, 'aio_pvp.mixins.json')
        def json = new JsonSlurper().parse(file)
        json.client = json.client.findAll { new File(classes.get().asFile, "pl/kerf/project/mixin/${it}.class").exists() }
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Testy klienta (Fabric client gametest): uruchamiają grę, tworzą świat i robią zrzuty ekranu modułów.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'aio_pvp_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Test zgodności z modami wydajnościowymi (Sodium, ImmediatelyFast z run/perf-mods, pobrane z Modrinth):
// ./gradlew :1.21.11:runClientGameTest -Pperf. Fabric sam przemapowuje te jary w grze testowej; bez -Pperf ich nie ma.
if (project.hasProperty('perf')) {
    loom.runs.configureEach {
        vmArg "-Dfabric.addMods=${file('run/perf-mods').absolutePath}"
    }
}
