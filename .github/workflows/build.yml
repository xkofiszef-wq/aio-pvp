name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build all Minecraft versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1.21.11 builds with Java 21, 26.x with Java 25 (Gradle finds both installs on its own).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aio-pvp
          path: |
            versions/*/build/libs/aio-pvp-*.jar
            !versions/*/build/libs/*-sources.jar
          if-no-files-found: error
